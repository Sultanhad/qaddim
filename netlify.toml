# Netlify build. The Supabase URL and publishable key are inlined by Vite at build time —
# both are public by design, and every table is guarded by row-level security.
# The secret key lives only in .env.local and in the scheduled worker; it never reaches a build.

[build]
  base    = "apps/web"
  command = "npm install && npm run build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"

# A single-page app: every path serves index.html so deep links work.
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
