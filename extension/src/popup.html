<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <style>
    :root { --bg:#05070f; --card:#0d1118; --line:#1d2435; --text:#f3f6ff; --dim:#93a0bd; --faint:#6b7794;
            --blue:#2f6bff; --good:#35d07f; --warn:#ffb020; --bad:#ff6b6b; }
    body { width: 360px; margin:0; background:var(--bg); color:var(--text);
           font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
    .pad { padding: 14px 16px; }
    h1 { font-size:16px; margin:0 0 4px; font-weight:800; }
    .faint { color:var(--faint); font-size:12px; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    button { border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--dim);
             padding:9px 14px; font:inherit; font-weight:700; cursor:pointer; }
    button.go { background:var(--blue); border-color:var(--blue); color:#fff; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin:10px 0; }
    .item { border-top:1px solid var(--line); padding:8px 0; font-size:13px; }
    .item:first-child { border-top:none; }
    .ok { color:var(--good); } .need { color:var(--warn); } .err { color:var(--bad); }
    label.sw { display:flex; justify-content:space-between; align-items:center; gap:10px; margin:8px 0; }
  </style>
</head>
<body>
  <div class="pad">
    <h1>قدّم</h1>
    <p class="faint" id="who">—</p>

    <div class="card">
      <p id="sends" style="margin:0 0 4px;font-weight:700"></p>
      <p class="faint" id="autoNote" style="margin:0"></p>
    </div>

    <div class="row">
      <button class="go" id="run">ابدأ</button>
      <button id="stop">أوقف</button>
      <span class="faint" id="queue"></span>
    </div>

    <div class="card" id="log"><p class="faint" style="margin:0">لا سجل بعد.</p></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
